name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: make test CC=${{ matrix.cc }}
      - name: Sanitizers
        run: make san CC=${{ matrix.cc }}
